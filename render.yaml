# Review the provider's current price before creating this always-on service.
services:
  - type: web
    name: hardbond-command
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeployTrigger: off
    disk:
      name: hardbond-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: OWNER_PASSWORD
        sync: false
